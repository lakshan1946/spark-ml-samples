allprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'master' &&
                details.requested.name == 'spark-stemming_2.10' &&
                details.requested.version == '0.1.1') {
                details.useTarget 'org.tartarus:snowball-stemmer:1.3.0.581.1'
            }
        }
    }
}
